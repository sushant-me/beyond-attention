name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject.toml declares; the rest guard against
        # regressions on current interpreters.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The CPU wheel, so CI does not pull a CUDA build it cannot use.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e . pytest
      - name: Test
        run: python -m pytest tests/ -q

      - name: The scan agrees with its own definition
        # The headline correctness claim, run as its own step so that a failure
        # here is unmistakable rather than one line among many.
        run: python -m pytest tests/test_scan.py -q -k "agrees or chunked"

      - name: No path in the scan can see the future
        # A separate step because this is the property a user of the model
        # depends on and the one a numerical-only test cannot catch.
        run: python -m pytest tests/test_scan.py -q -k "future"

      - name: Both architectures are on the same parameter budget
        # The claim the README's comparison rests on. If this step is removed,
        # the comparison is still published, and it would be unfair without
        # anyone noticing.
        run: python -m pytest tests/test_model.py -q -k "budget or mismatch"

      - name: The harness runs end to end
        # The experiment script is the artifact people will regenerate the
        # numbers with, so a broken flag or a missing import must fail CI rather
        # than be discovered by whoever tries to reproduce the README.
        run: |
          python experiments/run.py --pairs 2 --steps 20 --seeds 0 \
            --lengths 64 --scaling-batch 2 --out /tmp/ci-results.json
          test -s /tmp/ci-results.json || { echo "no results written"; exit 1; }
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("/tmp/ci-results.json").read_text())
          assert data["mqar"], "the sweep produced no rows"
          assert data["scaling"], "the scaling run produced no rows"
          print("harness wrote both sections: ok")
          PY

      - name: The voice front end, its control, and its renderer run end to end
        # The voicing control is asserted here rather than only in the tests
        # because it is the one number that would make every pitch figure in the
        # README meaningless if it broke: a detector that calls everything
        # voiced still passes every tone assertion. Rendering into a copy of the
        # README checks the renderer too, without writing to the checkout.
        run: |
          python experiments/voice_affect.py --out /tmp/voice-affect.json
          cp README.md /tmp/README.copy.md
          python experiments/render_readme.py --voice /tmp/voice-affect.json \
            --readme /tmp/README.copy.md
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("/tmp/voice-affect.json").read_text())
          accuracy = data["separability"]["accuracy"]
          chance = data["separability"]["chance"]
          assert accuracy > chance, f"descriptors carry no condition information: {accuracy} vs {chance}"
          noise = data["controls"]["white_noise_voicing"]["voiced_ratio_max"]
          assert noise < 0.05, f"white noise was reported as voiced: {noise}"
          rendered = pathlib.Path("/tmp/README.copy.md").read_text()
          for marker in ("| condition |", "| control |"):
              assert marker in rendered, f"voice render lost {marker!r}"
          print(f"voice front end ok: accuracy {accuracy:.3f} vs chance {chance:.3f}, "
                f"white-noise voiced ratio {noise:.3f}")
          PY

      - name: The store remembers past the working state, and the state does not
        # The long-memory contrast is asserted here rather than only in the tests
        # because it is the number the memory block's honesty rests on: without
        # it, "the store buys distance" is a claim with no measurement behind it.
        # The wide-state control is asserted too, because it is the one that says
        # the *bytes* are not what does the work. This is a different memory from
        # the selective family's: an external keyed store, not state slots.
        run: |
          python experiments/long_memory.py --out /tmp/long-memory.json
          cp README.md /tmp/README.memory.md
          python experiments/render_readme.py --memory /tmp/long-memory.json \
            --readme /tmp/README.memory.md
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("/tmp/long-memory.json").read_text())
          distance = data["distance"]
          longest = str(max(int(key) for key in distance))
          conditions = distance[longest]["conditions"]
          assert conditions["store"]["rate"] == 1.0, conditions["store"]
          for name in ("working_state", "wide_state", "retrieval_disabled"):
              assert conditions[name]["rate"] == 0.0, (name, conditions[name])
          cross = data["crossover"]
          assert cross["working_state_fails_at_distance"] == 1, cross
          assert cross["wide_state_fails_at_distance"] == 1, cross
          assert cross["store_exact_to_facts"] == 8, cross
          assert cross["store_first_failure_at_facts"] == 9, cross
          stale = data["stale"]["1"]["conditions"]
          assert stale["store"]["rate"] == 1.0, stale["store"]
          assert stale["stale_store"]["stale"] > 0, stale["stale_store"]
          rendered = pathlib.Path("/tmp/README.memory.md").read_text()
          for marker in ("| episode length |", "### The honest crossover",
                         "### The stale-fact control"):
              assert marker in rendered, f"memory render lost {marker!r}"
          print("long memory ok: the store solves distance %s and the working "
                "state solves none of it; the crossover is distance 1 and 9 facts"
                % longest)
          PY

      - name: Every rendered block is the renderer's output
        # The README claims every published number is generated, and that claim
        # was false in one place until this test existed: a hand-written section
        # inside the results block was deleted by re-rendering it. The test
        # re-renders every block from its JSON and compares it with the README.
        run: python -m pytest tests/test_render_readme.py -q

      - name: The dashboard is a render of the committed results
        # The dashboard is the one artifact whose test needs the committed file
        # to match a fresh render of the committed JSON, so a stale dashboard is
        # a test failure rather than something a reader has to notice.
        run: python -m pytest tests/test_dashboard.py -q

      - name: The agent loop carries state, and the gate is what the state is for
        # The no-memory contrast is asserted here rather than only in the tests
        # because it is the number the agent block's honesty rests on: without
        # it, "the state carries the result" is a claim with no measurement
        # behind it. So is the scalar carry, in both of its directions: it still
        # reproduces the agent row for row on the five arithmetic families, and
        # it *fails* on the selective family -- where a fixed-decay state of the
        # same width fails with it. Publishing the row and not guarding it would
        # be the easy half, and guarding only one direction would be the other.
        run: |
          python experiments/agent_loop.py --tasks-per-family 10 \
            --random-rounds 5 --out /tmp/agent-loop.json
          cp README.md /tmp/README.agent.md
          python experiments/render_readme.py --agent /tmp/agent-loop.json \
            --readme /tmp/README.agent.md
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("/tmp/agent-loop.json").read_text())
          solve, controls = data["solve_rate"], data["controls"]
          families = data["config"]["families"]
          width = data["config"]["selective"]["state_width"]

          # Every multi-step family is solved with the state and collapses
          # without it; the one-step family survives the wipe, which is what
          # says the control is not simply broken.
          for family in families:
              if family == "literal":
                  continue
              key = f"{family}@6"
              assert solve[key]["rate"] == 1.0, (family, solve[key])
              assert controls["no_memory"][key]["rate"] == 0.0, \
                  (family, controls["no_memory"][key])
          assert solve["literal@1"]["rate"] == 1.0
          assert controls["no_memory"]["literal@1"]["rate"] == 1.0

          # The scalar carry still ties the agent where one register is enough.
          for key, cell in solve.items():
              if key.startswith("selective"):
                  continue
              assert controls["scalar_carry"][key]["rate"] == cell["rate"], key

          # And fails where it is not, on exactly the tasks we predicted.
          scalar = controls["scalar_carry"]["selective@6"]
          assert 0.0 < scalar["rate"] < 1.0, scalar
          correspondence = controls["scalar_selective"]
          assert correspondence["correspondence_holds"], correspondence
          assert correspondence["solved"] == correspondence["queried_the_last_store"]
          assert correspondence["exact_matches"] == correspondence["tasks"]

          # A state of the same width with a constant gate fails with it: the
          # gating, not the width, is what the family measures.
          assert controls["fixed_decay"]["selective@6"]["rate"] < 1.0
          assert controls["fixed_equals_scalar_at_zero_distractors"]

          # Width is the capacity: one slot is the scalar, and enough slots for
          # the key space solve the family.
          widths = controls["state_width"]
          assert widths["0"]["agent"]["rate"] == 0.0, widths["0"]
          for slots, row in widths.items():
              if int(slots) == 0:
                  continue
              assert row["agent"]["rate"] >= row["scalar"]["rate"] or \
                  int(slots) < width, row
          for slots in (str(width), "8"):
              assert widths[slots]["agent"]["rate"] == 1.0, widths[slots]
              assert widths[slots]["fixed"]["rate"] < 1.0, widths[slots]
          assert widths["1"]["agent"]["rate"] == widths["1"]["scalar"]["rate"]

          # More distractors do not touch the gated state and do bury the
          # constant gate.
          rates = controls["distractor_rate"]
          assert all(row["agent"]["rate"] == 1.0 for row in rates.values()), rates
          assert all(row["none"]["rate"] == 0.0 for row in rates.values()), rates
          loudest = max(rates.values(), key=lambda row: row["distractors"])
          assert loudest["fixed"]["rate"] < loudest["agent"]["rate"]

          rendered = pathlib.Path("/tmp/README.agent.md").read_text()
          for marker in ("| task family |", "| condition |", "| A |",
                         "| memory slots |", "| distractor share |"):
              assert marker in rendered, f"agent render lost {marker!r}"
          print("agent loop ok: state 1.000 and no-memory 0.000 on every "
                f"carry family; scalar ties the arithmetic families and scores "
                f"{scalar['rate']:.3f} on selective; fixed decay "
                f"{controls['fixed_decay']['selective@6']['rate']:.3f}")
          PY

      - name: The trained classifier learns, and its controls fall to chance
        # The three numbers the emotion block's honesty rests on, asserted as
        # their own CI step so a failure is unmistakable: the classifier beats
        # chance on held-out utterances, the shuffled-label and noise-feature
        # controls do not, and a held-out *condition* collapses onto a training
        # class instead of being recognised. A quick configuration is used here;
        # the published numbers come from the full run recorded in the README.
        run: |
          python -u experiments/emotion_classifier.py --quick \
            --out /tmp/emotion-classifier.json
          cp README.md /tmp/README.emotion.md
          python experiments/render_readme.py --emotion \
            /tmp/emotion-classifier.json --readme /tmp/README.emotion.md
          python - <<'PY'
          import json, pathlib
          data = json.loads(
              pathlib.Path("/tmp/emotion-classifier.json").read_text()
          )
          training = data["training"]
          chance = training["chance"]
          assert data["correlate_checks"]["all_pass"], data["correlate_checks"]
          assert training["test_accuracy"] > chance + 0.3, training
          for key in ("label_shuffle", "random_features"):
              assert data["controls"][key]["mean"] < chance + 0.2, key
          cross = data["cross_condition"]
          assert cross["mean_dominant_fraction"] > 0.5, cross
          assert cross["mlp_agrees_with_nearest_centroid"] > 0.0
          rendered = pathlib.Path("/tmp/README.emotion.md").read_text()
          for marker in ("| condition |", "| control |", "| held out |"):
              assert marker in rendered, f"emotion render lost {marker!r}"
          print(f"emotion classifier ok: held-out {training['test_accuracy']:.3f} "
                f"vs chance {chance:.3f}; shuffle "
                f"{data['controls']['label_shuffle']['mean']:.3f}; noise "
                f"{data['controls']['random_features']['mean']:.3f}; "
                f"unseen-condition collapse "
                f"{cross['mean_dominant_fraction']:.3f}")
          PY
