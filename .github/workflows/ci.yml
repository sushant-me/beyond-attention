name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject.toml declares; the rest guard against
        # regressions on current interpreters.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The CPU wheel, so CI does not pull a CUDA build it cannot use.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e . pytest
      - name: Test
        run: python -m pytest tests/ -q

      - name: The scan agrees with its own definition
        # The headline correctness claim, run as its own step so that a failure
        # here is unmistakable rather than one line among many.
        run: python -m pytest tests/test_scan.py -q -k "agrees or chunked"

      - name: No path in the scan can see the future
        # A separate step because this is the property a user of the model
        # depends on and the one a numerical-only test cannot catch.
        run: python -m pytest tests/test_scan.py -q -k "future"

      - name: Both architectures are on the same parameter budget
        # The claim the README's comparison rests on. If this step is removed,
        # the comparison is still published, and it would be unfair without
        # anyone noticing.
        run: python -m pytest tests/test_model.py -q -k "budget or mismatch"

      - name: The harness runs end to end
        # The experiment script is the artifact people will regenerate the
        # numbers with, so a broken flag or a missing import must fail CI rather
        # than be discovered by whoever tries to reproduce the README.
        run: |
          python experiments/run.py --pairs 2 --steps 20 --seeds 0 \
            --lengths 64 --scaling-batch 2 --out /tmp/ci-results.json
          test -s /tmp/ci-results.json || { echo "no results written"; exit 1; }
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("/tmp/ci-results.json").read_text())
          assert data["mqar"], "the sweep produced no rows"
          assert data["scaling"], "the scaling run produced no rows"
          print("harness wrote both sections: ok")
          PY
